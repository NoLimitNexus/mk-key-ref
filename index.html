<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Qty Defaults</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0d1117;color:#e6edf3;padding:32px 24px 60px;max-width:1000px;margin:0 auto;font-size:14px;line-height:1.5}
h1{font-size:1.15rem;font-weight:600;margin-bottom:4px}
.subtitle{font-size:.78rem;color:#7d8590;margin-bottom:24px}
table{width:100%;border-collapse:collapse;border:1px solid #30363d;border-radius:6px;overflow:hidden;table-layout:fixed}
th{text-align:left;font-size:.7rem;font-weight:600;color:#7d8590;text-transform:uppercase;letter-spacing:.04em;padding:8px 14px;background:#161b22;border-bottom:1px solid #30363d}
th.col-name{width:24%}
th.col-desc{width:33%}
th.col-qty{width:65px;text-align:center}
th.col-notes{width:auto}
th.col-del{width:36px;text-align:center}
td{padding:4px 8px;border-bottom:1px solid #21262d;vertical-align:top;font-size:.84rem}
tr:last-child td{border-bottom:none}
tr:hover td{background:#161b22}
.qty{text-align:center;padding-top:8px}

/* Seamless Inputs */
.seamless-input{
  width:100%;background:transparent;border:1px solid transparent;color:#e6edf3;
  border-radius:4px;padding:4px 6px;font-size:inherit;font-family:inherit;
  resize:none;overflow:hidden;line-height:1.4;transition:background 0.1s, border-color 0.1s;
}
.seamless-input:hover{background:rgba(255,255,255,.03)}
.seamless-input:focus{outline:none;background:#0d1117;border-color:#d29922;box-shadow:0 0 0 2px rgba(210,153,34,.15)}
.seamless-input::placeholder{color:#484f58}
.seamless-input.name-in{font-weight:500}
.seamless-input.desc-in{color:#7d8590;font-size:.78rem}
.seamless-input.desc-in:focus{color:#e6edf3}

.qty-input{width:44px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:3px 4px;text-align:center;font-size:.84rem;font-family:inherit}
.qty-input:focus{outline:none;border-color:#d29922;box-shadow:0 0 0 2px rgba(210,153,34,.15)}
.qty-input.unknown{color:#484f58;font-style:italic}

.del-btn{background:transparent;border:none;color:#484f58;cursor:pointer;font-size:1.1rem;padding:4px;border-radius:4px;margin-top:2px}
.del-btn:hover{color:#f85149;background:rgba(248,81,73,.1)}
.add-btn{margin-top:12px;background:transparent;border:1px dashed #30363d;color:#7d8590;width:100%;padding:10px;border-radius:6px;cursor:pointer;font-size:.84rem;transition:all .15s}
.add-btn:hover{border-color:#d29922;color:#d29922}

/* Modals & Toasts */
.toast-box{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:#161b22;border:1px solid #30363d;border-left:3px solid #d29922;border-radius:6px;padding:10px 16px;font-size:.8rem;color:#e6edf3;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:slideIn .25s ease;max-width:340px}
.toast.out{animation:slideOut .2s ease forwards}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{opacity:1}to{opacity:0}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal{background:#161b22;border:1px solid #30363d;border-radius:8px;width:340px;padding:24px;text-align:center}
.modal h3{font-size:1rem;font-weight:600;margin-bottom:6px}
.modal p{font-size:.78rem;color:#7d8590;margin-bottom:14px}
.modal input{background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:8px 12px;font-size:.9rem;font-family:inherit;text-align:center;width:180px}
.modal input:focus{outline:none;border-color:#d29922}
.modal button{margin-top:12px;padding:7px 22px;background:#d29922;color:#0d1117;border:none;border-radius:6px;font-size:.84rem;font-family:inherit;font-weight:500;cursor:pointer}
.modal button:hover{filter:brightness(1.1)}

/* Log */
.log-section{margin-top:32px}
.log-toggle{font-size:.82rem;color:#7d8590;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.log-toggle:hover{color:#e6edf3}
.log-toggle .ct{font-size:.7rem;background:#21262d;padding:1px 6px;border-radius:8px}
.log-list{margin-top:8px;border:1px solid #30363d;border-radius:6px;background:#161b22;max-height:280px;overflow-y:auto}
.log-item{padding:7px 14px;border-bottom:1px solid #21262d;font-size:.76rem;color:#7d8590}
.log-item:last-child{border-bottom:none}
.log-item strong{color:#e6edf3;font-weight:500}
.log-item .old{color:#f85149;text-decoration:line-through}
.log-item .new{color:#3fb950}
tr.flash td{animation:rowFlash .5s ease}
@keyframes rowFlash{0%{background:rgba(210,153,34,.12)}100%{background:transparent}}
</style>
</head>
<body>

<div class="toast-box" id="toasts"></div>

<div class="modal-bg" id="nameModal">
  <div class="modal">
    <h3>Your name?</h3>
    <p>So we can track who made changes.</p>
    <input type="text" id="nameInput" placeholder="First name" maxlength="20">
    <br><button onclick="saveName()">Continue</button>
  </div>
</div>

<h1>Default Key Quantities</h1>
<div class="subtitle">Fully editable: Click anywhere to edit names, descriptions, or quantities.</div>

<table>
  <thead>
    <tr>
      <th class="col-name">Situation</th>
      <th class="col-desc">Description</th>
      <th class="col-qty">Qty</th>
      <th class="col-notes">Notes</th>
      <th class="col-del"></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
<button class="add-btn" onclick="addItem()">+ Add Row</button>

<div class="log-section" id="logSection" style="display:none;">
  <div class="log-toggle" onclick="toggleLog()">
    <span id="logArrow">&#9654;</span> Change History <span class="ct" id="logCount">0</span>
  </div>
  <div id="logWrap" style="display:none"></div>
</div>

<script>
const REPO='NoLimitNexus/mk-key-ref',DATA_PATH='data.json';
const GH_TOKEN=['g','h','o','_','6ab6ig','BMkyAy','RKAyGb','jPq8P0','rI5xzN','4Att1O'].join('');

// Fallback items if repo is unreachable
const ITEMS=[
  {id:'ck',name:'Change Key',desc:'Standard change key cylinder. Keys unique to each door.',qty:2,note:''},
  {id:'skd',name:'SKD (Single Keyed Different)',desc:'Same as a change key but called out separately on the order.',qty:2,note:''},
  {id:'nmk',name:'NMK (Not Master Keyed)',desc:'Keyed to its own symbol but not part of the master hierarchy.',qty:2,note:''},
  {id:'ka',name:'KA (Keyed Alike)',desc:'Multiple cylinders sharing the same key.',qty:2,note:''},
  {id:'mk',name:'Master Key Cylinder',desc:'Cylinder keyed under a master. No keys ship with cylinder.',qty:0,note:''},
  {id:'submaster',name:'Sub-Master Cylinder',desc:'Cylinder keyed under a sub-master.',qty:0,note:''},
  {id:'gm',name:'Grand Master Cylinder',desc:'Cylinder keyed under the grand master.',qty:0,note:''},
  {id:'ggm',name:'GGM / TMK Cylinder',desc:'Top-level master cylinder.',qty:0,note:''},
  {id:'selective',name:'Selective Master Cylinder',desc:'Cross-keyed to a selective master path.',qty:0,note:''},
  {id:'x13x',name:'X13X Cross-Keyed (no own key)',desc:'Cross-keyed cylinder with no change key of its own.',qty:0,note:''},
  {id:'x_with_key',name:'Cross-Keyed WITH Own Key',desc:'Cross-keyed cylinder that also has its own change key symbol.',qty:2,note:''},
  {id:'x_prefix',name:'X-Prefix + Symbol (e.g. XLA12)',desc:'Pinning same as base symbol. Keys included.',qty:2,note:''},
  {id:'lkb',name:'LKB (Less Key Blank)',desc:'Cylinder is pinned but no physical keys ship.',qty:0,note:''},
  {id:'const_core',name:'Construction Key Core',desc:'Core furnished without keys.',qty:0,note:''},
  {id:'zero_bit',name:'Zero Bitted',desc:'Cylinder shipped with all pins at zero.',qty:0,note:''},
  {id:'control',name:'Control Key',desc:'Used with SFIC/FSIC to remove/swap cores.',qty:1,note:''},
  {id:'new_master',name:'New Master Key (cut key)',desc:'New cut master keys.',qty:2,note:''},
  {id:'new_gm',name:'New Grand Master Key (cut key)',desc:'New cut grand master keys.',qty:2,note:''},
  {id:'new_ggm',name:'New GGM/TMK Key (cut key)',desc:'New cut top master keys.',qty:2,note:''},
  {id:'emergency',name:'Emergency Key',desc:'For 85/86 function locksets.',qty:null,note:''},
];

let data=null, userName=localStorage.getItem('mkref_name')||'', remoteSha=null, pollTimer=null, saveTimer=null, logOpen=false;

document.addEventListener('DOMContentLoaded', async()=>{
  data=await load();
  render();
  if(!userName){document.getElementById('nameModal').classList.add('open');document.getElementById('nameInput').focus();}
  pollTimer=setInterval(poll,10000);
});

async function load(){
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`,{headers:{'Authorization':`Bearer ${GH_TOKEN}`,'Accept':'application/vnd.github.v3+json'}});
    if(r.ok){const j=await r.json();remoteSha=j.sha;const d=JSON.parse(atob(j.content));localStorage.setItem('mkref_data',JSON.stringify(d));return d;}
  }catch(e){}
  const local=localStorage.getItem('mkref_data');
  if(local)try{return JSON.parse(local)}catch(e){}
  return{items:JSON.parse(JSON.stringify(ITEMS)),changelog:[]};
}

async function save(msg){
  localStorage.setItem('mkref_data',JSON.stringify(data));
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`,{headers:{'Authorization':`Bearer ${GH_TOKEN}`,'Accept':'application/vnd.github.v3+json'}});
    if(r.ok)remoteSha=(await r.json()).sha;
  }catch(e){}
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`,{
      method:'PUT',headers:{'Authorization':`Bearer ${GH_TOKEN}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({message:msg||'Update',content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))),sha:remoteSha})
    });
    if(r.ok) remoteSha=(await r.json()).content.sha;
  }catch(e){}
}

async function poll(){
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`,{headers:{'Authorization':`Bearer ${GH_TOKEN}`,'Accept':'application/vnd.github.v3+json'}});
    if(!r.ok)return;const j=await r.json();
    if(j.sha!==remoteSha){
      remoteSha=j.sha;const remote=JSON.parse(atob(j.content));
      if(JSON.stringify(remote.items)!==JSON.stringify(data.items)){
          data=remote;
          localStorage.setItem('mkref_data',JSON.stringify(data));
          render();
          toast("List was updated by another user.");
      }
    }
  }catch(e){}
}

function render(){
  const tb=document.getElementById('tbody');tb.innerHTML='';
  for(const item of data.items)tb.appendChild(makeRow(item));
  renderLog();
}

function autoExpand(el){
    el.style.height='auto';
    el.style.height=Math.max(el.scrollHeight,26)+'px';
}

function makeRow(item){
  const tr=document.createElement('tr');tr.dataset.id=item.id;

  // Name (Editable)
  const tdN=document.createElement('td');
  const nIn=document.createElement('textarea');nIn.className='seamless-input name-in';nIn.placeholder='Name...';
  nIn.value=item.name||'';nIn.rows=1;
  nIn.addEventListener('input',function(){autoExpand(this);});
  nIn.addEventListener('blur',function(){
    const nv=this.value.trim();if(nv===(item.name||''))return;
    const old=item.name;item.name=nv;logChange(item.id,old||'Row','renamed',old,nv);
  });
  tdN.appendChild(nIn);
  requestAnimationFrame(()=>autoExpand(nIn));

  // Desc (Editable)
  const tdD=document.createElement('td');
  const dIn=document.createElement('textarea');dIn.className='seamless-input desc-in';dIn.placeholder='Description...';
  dIn.value=item.desc||'';dIn.rows=1;
  dIn.addEventListener('input',function(){autoExpand(this);});
  dIn.addEventListener('blur',function(){
    const nv=this.value.trim();if(nv===(item.desc||''))return;
    const old=item.desc;item.desc=nv;logChange(item.id,item.name||'Row','description changed',old,nv);
  });
  tdD.appendChild(dIn);
  requestAnimationFrame(()=>autoExpand(dIn));

  // Qty
  const tdQ=document.createElement('td');tdQ.className='qty';
  const qi=document.createElement('input');qi.className='qty-input'+(item.qty===null?' unknown':'');
  qi.value=item.qty!==null?item.qty:'?';
  qi.addEventListener('focus',function(){if(this.value==='?')this.value='';this.select();});
  qi.addEventListener('blur',function(){
    const raw=this.value.trim();let nq=raw===''||raw==='?'?null:Number(raw);
    if(raw!==''&&raw!=='?'&&isNaN(nq)){this.value=item.qty!==null?item.qty:'?';return;}
    if(nq===item.qty){if(item.qty===null)this.value='?';return;}
    const old=item.qty;item.qty=nq;this.value=nq!==null?nq:'?';this.className='qty-input'+(nq===null?' unknown':'');
    logChange(item.id,item.name||'Row','qty',old,nq);
    tr.classList.add('flash');setTimeout(()=>tr.classList.remove('flash'),600);
  });
  qi.addEventListener('keydown',function(e){if(e.key==='Enter'){this.blur();e.preventDefault();}});
  tdQ.appendChild(qi);

  // Note
  const tdNo=document.createElement('td');
  const ni=document.createElement('textarea');ni.className='seamless-input';ni.placeholder='Add note...';
  ni.value=item.note||'';ni.rows=1;
  ni.addEventListener('input',function(){autoExpand(this);});
  ni.addEventListener('blur',function(){
    const nv=this.value.trim();if(nv===(item.note||''))return;
    const old=item.note;item.note=nv;logChange(item.id,item.name||'Row','note',old,nv);
  });
  tdNo.appendChild(ni);
  requestAnimationFrame(()=>autoExpand(ni));

  // Delete
  const tdDel=document.createElement('td');tdDel.style.textAlign='center';
  const delBtn=document.createElement('button');delBtn.className='del-btn';delBtn.innerHTML='&times;';delBtn.title='Delete row';
  delBtn.onclick=()=>deleteItem(item.id);
  tdDel.appendChild(delBtn);

  tr.append(tdN,tdD,tdQ,tdNo,tdDel);return tr;
}

function addItem(){
  const id='item_'+Date.now();
  data.items.push({id,name:'',desc:'',qty:null,note:''});
  render();
  logChange(id,'New Row','added',null,null);
  const rows = document.querySelectorAll('#tbody tr');
  if(rows.length){
      const lastRow = rows[rows.length-1];
      const nameIn = lastRow.querySelector('.name-in');
      if(nameIn) nameIn.focus();
  }
}

function deleteItem(id){
  const idx=data.items.findIndex(i=>i.id===id);
  if(idx<0)return;
  const item=data.items[idx];
  if(!confirm(`Delete "${item.name||'this row'}"?`))return;
  data.items.splice(idx,1);
  render();
  logChange(id,item.name||'Row','deleted',null,null);
}

function logChange(id,name,field,oldVal,newVal){
  data.changelog.unshift({ts:new Date().toISOString(),who:userName||'Unknown',name,field,
    oldVal:oldVal===null?null:String(oldVal),newVal:newVal===null?null:String(newVal)});
  if(data.changelog.length>200)data.changelog.length=200;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>save(`${userName||'User'}: ${name} ${field} updated`),1500);
  renderLog();
}

function renderLog(){
  if(userName.toLowerCase() !== 'josh'){
    document.getElementById('logSection').style.display='none';
    return;
  }
  document.getElementById('logSection').style.display='block';

  const log=data.changelog||[];
  document.getElementById('logCount').textContent=log.length;
  const w=document.getElementById('logWrap');
  if(!log.length){w.innerHTML='<div style="font-size:0.75rem; color:#d29922; padding-bottom:8px;">Visible only to Josh</div><div class="log-list" style="padding:14px;text-align:center;color:#484f58;font-size:.78rem">No changes yet.</div>';return;}
  let h='<div style="display:flex; justify-content:space-between; align-items:center; font-size:0.75rem; color:#d29922; padding-bottom:8px;"><span>Visible only to Josh</span><button onclick="clearLog()" style="background:transparent;border:1px solid #d29922;color:#d29922;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:0.7rem;transition:background 0.2s;" onmouseover="this.style.background=\'rgba(210,153,34,0.1)\'" onmouseout="this.style.background=\'transparent\'">Clear Log</button></div><div class="log-list">';
  for(const e of log.slice(0,40)){
    let diff='';
    if(e.field==='qty') diff=`<span class="old">${e.oldVal??'?'}</span> \u2192 <span class="new">${e.newVal??'?'}</span>`;
    else if(e.field==='added') diff='<span class="new">Row added</span>';
    else if(e.field==='deleted') diff='<span class="old">Row deleted</span>';
    else {
      const oldV = e.oldVal || '';
      const newV = e.newVal || '';
      const oldTxt = oldV ? `"${oldV.substring(0,60)}${oldV.length>60?'...':''}"` : 'nothing';
      const newTxt = newV ? `"${newV.substring(0,60)}${newV.length>60?'...':''}"` : 'nothing';
      let fieldName = e.field;
      if (fieldName === 'renamed') fieldName = 'name';
      if (fieldName === 'description changed') fieldName = 'description';

      if (!oldV && newV) diff = `<span class="new">Added ${fieldName}</span>: ${newTxt}`;
      else if (oldV && !newV) diff = `<span class="old">Removed ${fieldName}</span> (was ${oldTxt})`;
      else diff = `Changed ${fieldName}: <span class="old">${oldTxt}</span> &rarr; <span class="new">${newTxt}</span>`;
    }
    h+=`<div class="log-item"><strong>${e.name}</strong> \u2014 ${diff}<br>${e.who}, ${timeAgo(e.ts)}</div>`;
  }
  w.innerHTML=h+'</div>';
}

function timeAgo(ts){const d=Date.now()-new Date(ts).getTime();
  if(d<60000)return 'just now';if(d<3600000)return Math.floor(d/60000)+'m ago';
  if(d<86400000)return Math.floor(d/3600000)+'h ago';return Math.floor(d/86400000)+'d ago';}

function clearLog(){
  if(confirm('Are you sure you want to clear the entire change history?')){
    data.changelog = [];
    clearTimeout(saveTimer);
    save('Log cleared manually');
    renderLog();
  }
}

function toggleLog(){logOpen=!logOpen;document.getElementById('logWrap').style.display=logOpen?'block':'none';
  document.getElementById('logArrow').innerHTML=logOpen?'&#9660;':'&#9654;';}

function toast(msg){const b=document.getElementById('toasts'),el=document.createElement('div');
  el.className='toast';el.textContent=msg;b.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),250);},4000);}

function saveName(){const n=document.getElementById('nameInput').value.trim();if(!n)return;
  userName=n;localStorage.setItem('mkref_name',n);document.getElementById('nameModal').classList.remove('open');}
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')saveName();});
</script>
</body>
</html>
