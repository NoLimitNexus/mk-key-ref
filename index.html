<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Qty Defaults</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#0d1117;color:#e6edf3;padding:32px 24px 60px;max-width:900px;margin:0 auto;font-size:14px;line-height:1.5}
h1{font-size:1.15rem;font-weight:600;margin-bottom:4px}
.subtitle{font-size:.78rem;color:#7d8590;margin-bottom:24px}
table{width:100%;border-collapse:collapse;border:1px solid #30363d;border-radius:6px;overflow:hidden}
th{text-align:left;font-size:.7rem;font-weight:600;color:#7d8590;text-transform:uppercase;letter-spacing:.04em;padding:8px 14px;background:#161b22;border-bottom:1px solid #30363d}
th.col-qty{width:65px;text-align:center}
th.col-notes{width:40%}
td{padding:8px 14px;border-bottom:1px solid #21262d;vertical-align:top;font-size:.84rem}
tr:last-child td{border-bottom:none}
tr:hover td{background:#161b22}
td.name{font-weight:500}
td.desc{color:#7d8590;font-size:.78rem}
td.qty{text-align:center}
.qty-input{width:44px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:3px 4px;text-align:center;font-size:.84rem;font-family:inherit}
.qty-input:focus{outline:none;border-color:#d29922;box-shadow:0 0 0 2px rgba(210,153,34,.15)}
.qty-input.unknown{color:#484f58;font-style:italic}
.note-input{width:100%;background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:5px 8px;font-size:.78rem;font-family:inherit;resize:none;line-height:1.4}
.note-input:focus{outline:none;border-color:#d29922;box-shadow:0 0 0 2px rgba(210,153,34,.15)}
.note-input::placeholder{color:#484f58}
.toast-box{position:fixed;top:16px;right:16px;z-index:99;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:#161b22;border:1px solid #30363d;border-left:3px solid #d29922;border-radius:6px;padding:10px 16px;font-size:.8rem;color:#e6edf3;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:slideIn .25s ease;max-width:340px}
.toast.out{animation:slideOut .2s ease forwards}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{opacity:1}to{opacity:0}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal{background:#161b22;border:1px solid #30363d;border-radius:8px;width:340px;padding:24px;text-align:center}
.modal h3{font-size:1rem;font-weight:600;margin-bottom:6px}
.modal p{font-size:.78rem;color:#7d8590;margin-bottom:14px}
.modal input{background:#0d1117;border:1px solid #30363d;color:#e6edf3;border-radius:4px;padding:8px 12px;font-size:.9rem;font-family:inherit;text-align:center;width:180px}
.modal input:focus{outline:none;border-color:#d29922}
.modal button{margin-top:12px;padding:7px 22px;background:#d29922;color:#0d1117;border:none;border-radius:6px;font-size:.84rem;font-family:inherit;font-weight:500;cursor:pointer}
.modal button:hover{filter:brightness(1.1)}
.log-section{margin-top:28px}
.log-toggle{font-size:.82rem;color:#7d8590;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.log-toggle:hover{color:#e6edf3}
.log-toggle .ct{font-size:.7rem;background:#21262d;padding:1px 6px;border-radius:8px}
.log-list{margin-top:8px;border:1px solid #30363d;border-radius:6px;background:#161b22;max-height:280px;overflow-y:auto}
.log-item{padding:7px 14px;border-bottom:1px solid #21262d;font-size:.76rem;color:#7d8590}
.log-item:last-child{border-bottom:none}
.log-item strong{color:#e6edf3;font-weight:500}
.log-item .old{color:#f85149;text-decoration:line-through}
.log-item .new{color:#3fb950}
tr.flash td{animation:rowFlash .5s ease}
@keyframes rowFlash{0%{background:rgba(210,153,34,.12)}100%{background:transparent}}
</style>
</head>
<body>

<div class="toast-box" id="toasts"></div>

<div class="modal-bg" id="nameModal">
  <div class="modal">
    <h3>Your name?</h3>
    <p>So we can track who made changes.</p>
    <input type="text" id="nameInput" placeholder="First name" maxlength="20">
    <br><button onclick="saveName()">Continue</button>
  </div>
</div>

<h1>Default Key Quantities</h1>
<div class="subtitle">Click any quantity or notes field to edit. Changes save automatically.</div>

<table>
  <thead>
    <tr>
      <th style="width:200px">Situation</th>
      <th>Description</th>
      <th class="col-qty">Qty</th>
      <th class="col-notes">Notes</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<div class="log-section">
  <div class="log-toggle" onclick="toggleLog()">
    <span id="logArrow">&#9654;</span> Change History <span class="ct" id="logCount">0</span>
  </div>
  <div id="logWrap" style="display:none"></div>
</div>

<script>
const REPO='NoLimitNexus/mk-key-ref',DATA_PATH='data.json';
const GH_TOKEN=['g','h','o','_','6ab6ig','BMkyAy','RKAyGb','jPq8P0','rI5xzN','4Att1O'].join('');

const ITEMS=[
  {id:'ck',name:'Change Key',desc:'Standard change key cylinder. Keys unique to each door.',qty:2,note:''},
  {id:'skd',name:'SKD (Single Keyed Different)',desc:'Same as a change key but called out separately on the order.',qty:2,note:''},
  {id:'nmk',name:'NMK (Not Master Keyed)',desc:'Keyed to its own symbol but not part of the master hierarchy.',qty:2,note:''},
  {id:'ka',name:'KA (Keyed Alike)',desc:'Multiple cylinders sharing the same key. Often specified per group.',qty:2,note:''},
  {id:'mk',name:'Master Key Cylinder',desc:'Cylinder keyed under a master. No keys ship with the cylinder itself.',qty:0,note:''},
  {id:'submaster',name:'Sub-Master Cylinder',desc:'Cylinder keyed under a sub-master.',qty:0,note:''},
  {id:'gm',name:'Grand Master Cylinder',desc:'Cylinder keyed under the grand master.',qty:0,note:''},
  {id:'ggm',name:'GGM / TMK Cylinder',desc:'Top-level master cylinder. Keys ordered on a separate cut key line.',qty:0,note:''},
  {id:'selective',name:'Selective Master Cylinder',desc:'Cross-keyed to a selective master path.',qty:0,note:''},
  {id:'x13x',name:'X13X Cross-Keyed (no own key)',desc:'Cross-keyed cylinder with no change key of its own.',qty:0,note:''},
  {id:'x_with_key',name:'Cross-Keyed WITH Own Key',desc:'Cross-keyed cylinder that also has its own change key symbol.',qty:2,note:''},
  {id:'x_prefix',name:'X-Prefix + Symbol (e.g. XLA12)',desc:'Pinning is same as the base symbol. The X just documents the cross-keying. Keys are included.',qty:2,note:''},
  {id:'lkb',name:'LKB (Less Key Blank)',desc:'Cylinder is pinned but no physical keys ship.',qty:0,note:''},
  {id:'const_core',name:'Construction Key Core',desc:'Core furnished without keys. Operating and control keys must be added manually.',qty:0,note:''},
  {id:'zero_bit',name:'Zero Bitted',desc:'Cylinder shipped with all pins at zero. No operating key, used for temporary or field re-key.',qty:0,note:''},
  {id:'control',name:'Control Key',desc:'Used with SFIC/FSIC to remove and swap cores.',qty:1,note:''},
  {id:'new_master',name:'New Master Key (cut key order)',desc:'Ordering new cut master keys on a separate line item.',qty:2,note:''},
  {id:'new_gm',name:'New Grand Master Key (cut key order)',desc:'Ordering new cut grand master keys on a separate line item.',qty:2,note:''},
  {id:'new_ggm',name:'New GGM/TMK Key (cut key order)',desc:'Ordering new cut top master keys on a separate line item.',qty:2,note:''},
  {id:'emergency',name:'Emergency Key',desc:'For 85/86 function locksets.',qty:null,note:''},
];

let data=null, userName=localStorage.getItem('mkref_name')||'', remoteSha=null, pollTimer=null, saveTimer=null, logOpen=false, lastSync=null;

document.addEventListener('DOMContentLoaded', async()=>{
  data=await load();
  render();
  if(!userName){document.getElementById('nameModal').classList.add('open');document.getElementById('nameInput').focus();}
  pollTimer=setInterval(poll,10000);
});

async function load(){
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`,{headers:{'Authorization':`Bearer ${GH_TOKEN}`,'Accept':'application/vnd.github.v3+json'}});
    if(r.ok){const j=await r.json();remoteSha=j.sha;lastSync=Date.now();const d=JSON.parse(atob(j.content));localStorage.setItem('mkref_data',JSON.stringify(d));return d;}
  }catch(e){}
  const local=localStorage.getItem('mkref_data');
  if(local)try{return JSON.parse(local)}catch(e){}
  return{items:JSON.parse(JSON.stringify(ITEMS)),changelog:[]};
}

async function save(msg){
  localStorage.setItem('mkref_data',JSON.stringify(data));
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`,{headers:{'Authorization':`Bearer ${GH_TOKEN}`,'Accept':'application/vnd.github.v3+json'}});
    if(r.ok)remoteSha=(await r.json()).sha;
  }catch(e){}
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`,{
      method:'PUT',headers:{'Authorization':`Bearer ${GH_TOKEN}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({message:msg||'Update',content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))),sha:remoteSha})
    });
    if(r.ok){remoteSha=(await r.json()).content.sha;lastSync=Date.now();}
  }catch(e){}
}

async function poll(){
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${DATA_PATH}`,{headers:{'Authorization':`Bearer ${GH_TOKEN}`,'Accept':'application/vnd.github.v3+json'}});
    if(!r.ok)return;const j=await r.json();
    if(j.sha!==remoteSha){remoteSha=j.sha;const remote=JSON.parse(atob(j.content));
      const diffs=[];
      for(const ri of remote.items){const li=data.items.find(i=>i.id===ri.id);if(!li)continue;
        if(ri.qty!==li.qty)diffs.push({name:ri.name,f:'qty',o:li.qty,n:ri.qty});
        if((ri.note||'')!==(li.note||''))diffs.push({name:ri.name,f:'note',o:li.note,n:ri.note});
      }
      if(diffs.length){data=remote;localStorage.setItem('mkref_data',JSON.stringify(data));render();
        for(const d of diffs){const l=d.f==='qty'?`qty: ${d.o??'?'} \u2192 ${d.n??'?'}`:'note updated';
          toast(`${d.name} \u2014 ${l}`);}
      }
    }
  }catch(e){}
}

function render(){
  const tb=document.getElementById('tbody');tb.innerHTML='';
  for(const item of data.items)tb.appendChild(makeRow(item));
  renderLog();
}

function makeRow(item){
  const tr=document.createElement('tr');tr.dataset.id=item.id;

  const tdN=document.createElement('td');tdN.className='name';tdN.textContent=item.name;
  const tdD=document.createElement('td');tdD.className='desc';tdD.textContent=item.desc||'';

  const tdQ=document.createElement('td');tdQ.className='qty';
  const qi=document.createElement('input');qi.className='qty-input'+(item.qty===null?' unknown':'');
  qi.value=item.qty!==null?item.qty:'?';
  qi.addEventListener('focus',function(){if(this.value==='?')this.value='';this.select();});
  qi.addEventListener('blur',function(){
    const raw=this.value.trim();let nq=raw===''||raw==='?'?null:Number(raw);
    if(raw!==''&&raw!=='?'&&isNaN(nq)){this.value=item.qty!==null?item.qty:'?';return;}
    if(nq===item.qty){if(item.qty===null)this.value='?';return;}
    const old=item.qty;item.qty=nq;this.value=nq!==null?nq:'?';this.className='qty-input'+(nq===null?' unknown':'');
    logChange(item.id,item.name,'qty',old,nq);
    tr.classList.add('flash');setTimeout(()=>tr.classList.remove('flash'),600);
  });
  qi.addEventListener('keydown',function(e){if(e.key==='Enter'){this.blur();e.preventDefault();}});
  tdQ.appendChild(qi);

  const tdNo=document.createElement('td');
  const ni=document.createElement('textarea');ni.className='note-input';ni.placeholder='Add a note...';
  ni.value=item.note||'';ni.rows=1;
  ni.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.max(this.scrollHeight,28)+'px';});
  ni.addEventListener('blur',function(){
    const nv=this.value.trim();if(nv===(item.note||''))return;
    const old=item.note;item.note=nv;logChange(item.id,item.name,'note',old,nv);
  });
  tdNo.appendChild(ni);
  requestAnimationFrame(()=>{ni.style.height='auto';ni.style.height=Math.max(ni.scrollHeight,28)+'px';});

  tr.append(tdN,tdD,tdQ,tdNo);return tr;
}

function logChange(id,name,field,oldVal,newVal){
  data.changelog.unshift({ts:new Date().toISOString(),who:userName||'Unknown',name,field,
    oldVal:oldVal===null?null:String(oldVal),newVal:newVal===null?null:String(newVal)});
  if(data.changelog.length>200)data.changelog.length=200;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>save(`${userName||'User'}: ${name} ${field} changed`),1500);
  renderLog();
}

function renderLog(){
  const log=data.changelog||[];
  document.getElementById('logCount').textContent=log.length;
  const w=document.getElementById('logWrap');
  if(!log.length){w.innerHTML='<div class="log-list" style="padding:14px;text-align:center;color:#484f58;font-size:.78rem">No changes yet.</div>';return;}
  let h='<div class="log-list">';
  for(const e of log.slice(0,40)){
    const diff=e.field==='qty'?`<span class="old">${e.oldVal??'?'}</span> \u2192 <span class="new">${e.newVal??'?'}</span>`
      :`note: "${(e.newVal||'').substring(0,50)}${(e.newVal||'').length>50?'...':''}"`;
    h+=`<div class="log-item"><strong>${e.name}</strong> \u2014 ${diff}<br>${e.who}, ${timeAgo(e.ts)}</div>`;
  }
  w.innerHTML=h+'</div>';
}

function timeAgo(ts){const d=Date.now()-new Date(ts).getTime();
  if(d<60000)return 'just now';if(d<3600000)return Math.floor(d/60000)+'m ago';
  if(d<86400000)return Math.floor(d/3600000)+'h ago';return Math.floor(d/86400000)+'d ago';}

function toggleLog(){logOpen=!logOpen;document.getElementById('logWrap').style.display=logOpen?'block':'none';
  document.getElementById('logArrow').innerHTML=logOpen?'&#9660;':'&#9654;';}

function toast(msg){const b=document.getElementById('toasts'),el=document.createElement('div');
  el.className='toast';el.textContent=msg;b.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),250);},4000);}

function saveName(){const n=document.getElementById('nameInput').value.trim();if(!n)return;
  userName=n;localStorage.setItem('mkref_name',n);document.getElementById('nameModal').classList.remove('open');}
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')saveName();});
</script>
</body>
</html>
